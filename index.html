<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2540">
<meta name="description" content="UNIVEN SAFE — a simple, secure way for students to report safety incidents and track their progress.">
<title>UNIVEN SAFE — University Safety Platform</title>
<style>
:root{
  --navy:#0A2540; --navy-700:#123A63; --navy-500:#1B4F80;
  --blue:#2E7DD1; --blue-600:#2668B0; --blue-100:#DCEAF9; --blue-50:#EDF4FC;
  --grey-50:#F6F8FB; --grey-100:#EEF2F7; --grey-200:#DFE6EE; --grey-300:#C9D3DF;
  --grey-500:#6B7C8F; --grey-600:#54637A; --white:#FFFFFF;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(10,37,64,.05), 0 2px 8px rgba(10,37,64,.06);
  --shadow-md:0 6px 20px rgba(10,37,64,.10);
  --header-h:60px; --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;color:var(--navy);background:var(--grey-50);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,h4{color:var(--navy);line-height:1.25;margin:0 0 .5rem}
h1{font-size:1.65rem;letter-spacing:-.02em}
h2{font-size:1.25rem;letter-spacing:-.01em}
h3{font-size:1.05rem}
p{margin:0 0 .75rem}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;z-index:200;border-radius:0 0 8px 0}
.skip-link:focus{left:0}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 16px}
.narrow{max-width:640px;margin:0 auto}
.page{padding:20px 0 40px;min-height:60vh}
.page.has-bottomnav{padding-bottom:calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.spacer{flex:1}
.topbar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.08), var(--shadow)}
.topbar-inner{max-width:1120px;margin:0 auto;padding:0 16px;height:var(--header-h);display:flex;align-items:center;gap:14px}
.brand{display:inline-flex;align-items:center;gap:9px;color:#fff;font-weight:800;letter-spacing:.04em;font-size:1rem;text-decoration:none;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand svg{flex:none;color:#7FB6EC}
.brand strong{font-weight:800;color:#7FB6EC}
.topnav{display:none;gap:4px;margin-left:14px}
.topnav a{color:#C9D9EA;padding:8px 12px;border-radius:8px;font-size:.9rem;font-weight:600;text-decoration:none}
.topnav a:hover{background:rgba(255,255,255,.08);color:#fff;text-decoration:none}
.topnav a.active{background:rgba(127,182,236,.18);color:#fff}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.16)}
@media(min-width:900px){.topnav{display:flex}.has-topnav .menu-btn{display:none}}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:70;background:#fff;border-top:1px solid var(--grey-200);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(10,37,64,.06)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px 8px;min-height:var(--nav-h);color:var(--grey-500);font-size:.68rem;font-weight:700;letter-spacing:.01em;text-decoration:none}
.bottomnav a:hover{text-decoration:none;color:var(--navy-500)}
.bottomnav a.active{color:var(--navy)}
.bottomnav a.active svg{color:var(--blue)}
@media(min-width:900px){.bottomnav{display:none}}
.admin-layout{display:block}
.admin-side{display:none}
@media(min-width:900px){
  .admin-layout{display:grid;grid-template-columns:236px 1fr;gap:0;align-items:start;max-width:1280px;margin:0 auto}
  .admin-side{display:block;position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));padding:20px 12px;background:#fff;border-right:1px solid var(--grey-200);overflow-y:auto}
  .admin-side a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:var(--grey-600);font-weight:600;font-size:.93rem;text-decoration:none;margin-bottom:3px}
  .admin-side a:hover{background:var(--grey-50);color:var(--navy);text-decoration:none}
  .admin-side a.active{background:var(--blue-50);color:var(--navy);font-weight:700}
  .admin-side a.active svg{color:var(--blue)}
  .admin-side .side-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--grey-500);font-weight:800;padding:14px 13px 6px}
}
.drawer-overlay{position:fixed;inset:0;background:rgba(10,37,64,.45);z-index:90;opacity:0;pointer-events:none;transition:opacity .18s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:84vw;z-index:100;background:#fff;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.drawer.open{transform:translateX(0)}
.drawer-head{background:var(--navy);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}
.drawer-body{padding:12px;overflow-y:auto;flex:1}
.drawer-body a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;color:var(--navy);font-weight:600;text-decoration:none;margin-bottom:2px}
.drawer-body a:hover{background:var(--grey-50);text-decoration:none}
.drawer-body a.active{background:var(--blue-50);font-weight:700}
.drawer-body a.active svg{color:var(--blue)}
.card{background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card--flush{padding:0;overflow:hidden}
.card-head{padding:16px 18px;border-bottom:1px solid var(--grey-200);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h2,.card-head h3{margin:0}
.card-body{padding:18px}
.card-foot{padding:14px 18px;border-top:1px solid var(--grey-200);background:var(--grey-50);border-radius:0 0 var(--radius) var(--radius)}
.section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--grey-500);font-weight:800;margin:26px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.93rem;cursor:pointer;text-decoration:none;min-height:46px;transition:background-color .12s ease,border-color .12s ease,color .12s ease;text-align:center}
.btn:hover{text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--navy-700)}
.btn-accent{background:var(--blue);color:#fff}
.btn-accent:hover:not(:disabled){background:var(--blue-600)}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--grey-300)}
.btn-outline:hover:not(:disabled){border-color:var(--navy);background:var(--grey-50)}
.btn-outline-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn-outline-light:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:#fff}
.btn-ghost{background:transparent;color:#fff;border-color:transparent}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.12)}
.btn-soft{background:var(--blue-50);color:var(--navy);border-color:var(--blue-100)}
.btn-soft:hover:not(:disabled){background:var(--blue-100)}
.btn-sm{padding:7px 13px;min-height:38px;font-size:.85rem;border-radius:8px}
.btn-lg{padding:14px 24px;min-height:52px;font-size:1rem}
.btn-block{width:100%}
.field{margin-bottom:16px}
.label{display:block;font-weight:700;font-size:.86rem;color:var(--navy);margin-bottom:6px}
.label .req{color:var(--blue)}
.input,.select,.textarea{width:100%;padding:12px 13px;border:1px solid var(--grey-300);border-radius:10px;background:#fff;color:var(--navy);font-size:1rem;font-family:inherit;min-height:48px;transition:border-color .12s ease, box-shadow .12s ease}
.textarea{min-height:120px;resize:vertical;line-height:1.5}
.select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2354637A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center;padding-right:40px}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:#B23B3B}
.input:disabled,.textarea:disabled{background:var(--grey-100);color:var(--grey-600);cursor:not-allowed}
.hint{font-size:.8rem;color:var(--grey-500);margin-top:5px}
.error-text{font-size:.82rem;color:#B23B3B;font-weight:600;margin-top:5px;display:flex;gap:6px;align-items:flex-start}
.form-grid{display:grid;gap:0 16px}
@media(min-width:640px){.form-grid.two{grid-template-columns:1fr 1fr}}
.file-drop{border:1.5px dashed var(--grey-300);border-radius:var(--radius-sm);background:var(--grey-50);padding:18px;text-align:center;cursor:pointer;display:block}
.file-drop:hover{border-color:var(--blue);background:var(--blue-50)}
.file-drop input{display:none}
.file-name{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--blue-50);border:1px solid var(--blue-100);border-radius:10px;font-size:.86rem}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.75rem;font-weight:800;border:1px solid transparent;white-space:nowrap;letter-spacing:.01em}
.badge svg{width:14px;height:14px;flex:none}
.st-pending{background:var(--grey-100);color:var(--grey-600);border-color:var(--grey-300)}
.st-review{background:var(--blue-50);color:var(--blue-600);border-color:var(--blue-100)}
.st-progress{background:var(--navy);color:#fff;border-color:var(--navy)}
.st-resolved{background:#fff;color:var(--navy);border-color:var(--navy)}
.st-closed{background:var(--grey-50);color:var(--grey-500);border-color:var(--grey-200)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .stat-label{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--grey-500)}
.stat .stat-value{font-size:1.9rem;font-weight:800;color:var(--navy);line-height:1.1;margin-top:6px}
.stat.accent{background:var(--navy);border-color:var(--navy)}
.stat.accent .stat-label{color:#9CC4EA}
.stat.accent .stat-value{color:#fff}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;align-items:center;gap:14px;padding:18px;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;color:var(--navy);min-height:86px;transition:border-color .12s ease, transform .12s ease}
.tile:hover{border-color:var(--blue);transform:translateY(-1px);text-decoration:none}
.tile .tile-icon{width:48px;height:48px;flex:none;border-radius:12px;background:var(--blue-50);color:var(--blue-600);display:flex;align-items:center;justify-content:center}
.tile.urgent .tile-icon{background:var(--navy);color:#fff}
.tile .tile-title{font-weight:800;font-size:1rem}
.tile .tile-sub{font-size:.82rem;color:var(--grey-500);line-height:1.35}
.report-card{display:block;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.report-card:hover{border-color:var(--blue);text-decoration:none}
.report-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.report-card .rc-id{font-weight:800;font-size:.95rem;color:var(--navy);letter-spacing:.02em}
.report-card .rc-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.87rem}
.report-card .rc-meta dt{color:var(--grey-500);font-weight:600}
.report-card .rc-meta dd{margin:0;color:var(--navy);font-weight:600}
.data-row{display:grid;gap:10px;padding:14px 16px;border-bottom:1px solid var(--grey-200);text-decoration:none;color:inherit}
.data-row:last-child{border-bottom:none}
.data-row:hover{background:var(--grey-50);text-decoration:none}
.data-row .dr-line{display:flex;justify-content:space-between;gap:12px;align-items:center}
.data-row .dr-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--grey-500);font-weight:800}
@media(min-width:820px){
  .data-row{grid-template-columns:120px 1.1fr 1fr 1fr 150px 130px;align-items:center;gap:12px}
  .data-row .dr-mobile-label{display:none}
  .data-head{display:grid;grid-template-columns:120px 1.1fr 1fr 1fr 150px 130px;gap:12px;padding:11px 16px;background:var(--grey-50);border-bottom:1px solid var(--grey-200);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--grey-500);font-weight:800}
}
@media(max-width:819px){
  .data-head{display:none}
  .data-row .dr-cell{display:flex;justify-content:space-between;gap:12px}
  .data-row .dr-cell::before{content:attr(data-label);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--grey-500);font-weight:800}
}
.hero{background:var(--navy);color:#fff;padding:56px 0 60px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:rgba(46,125,209,.16)}
.hero-inner{max-width:1120px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.hero-eyebrow{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9CC4EA;border:1px solid rgba(156,196,234,.35);padding:5px 12px;border-radius:999px;margin-bottom:18px}
.hero h1{color:#fff;font-size:2.6rem;letter-spacing:-.03em;margin-bottom:8px}
.hero-tag{font-size:1.15rem;font-weight:700;color:#7FB6EC;margin-bottom:16px}
.hero-text{font-size:1rem;color:#C9D9EA;max-width:600px;margin-bottom:28px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:520px){.hero{padding:40px 0 44px}.hero h1{font-size:2rem}.hero-actions .btn{width:100%}}
.landing-section{padding:44px 0;border-bottom:1px solid var(--grey-200)}
.landing-section:last-of-type{border-bottom:none}
.landing-section h2{margin-bottom:16px}
.feature-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.feature-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.feature-grid{grid-template-columns:repeat(3,1fr)}}
.feature{background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.feature .f-icon{width:44px;height:44px;border-radius:11px;background:var(--blue-50);color:var(--blue-600);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.feature h3{margin-bottom:6px}
.feature p{font-size:.9rem;color:var(--grey-600);margin:0}
.steps{counter-reset:s;display:grid;gap:14px}
@media(min-width:700px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);padding:18px;position:relative;box-shadow:var(--shadow)}
.step::before{counter-increment:s;content:counter(s);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:.85rem;margin-bottom:10px}
.step h3{font-size:.98rem}
.step p{font-size:.86rem;color:var(--grey-600);margin:0}
.site-footer{background:var(--navy);color:#9CC4EA;padding:32px 0;font-size:.86rem}
.site-footer strong{color:#fff}
.alert{display:flex;gap:11px;padding:13px 15px;border-radius:var(--radius-sm);font-size:.9rem;border:1px solid var(--grey-200);background:var(--grey-50);align-items:flex-start}
.alert svg{flex:none;margin-top:2px}
.alert-info{background:var(--blue-50);border-color:var(--blue-100);color:var(--navy-700)}
.alert-warn{background:#FFF6E8;border-color:#F0D9AE;color:#7A5312}
.alert-success{background:#EAF6EF;border-color:#BFE0CD;color:#1B5E3A}
.alert-error{background:#FDECEC;border-color:#F3C4C4;color:#8E2F2F}
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--grey-50)}
.auth-main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 48px}
.auth-card{width:100%;max-width:460px;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-md)}
.auth-head{text-align:center;margin-bottom:22px}
.auth-head .auth-icon{width:56px;height:56px;border-radius:15px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.auth-head h1{font-size:1.4rem;margin-bottom:4px}
.auth-head p{color:var(--grey-600);font-size:.9rem;margin:0}
.confirm-box{text-align:center;padding:34px 20px}
.confirm-check{width:76px;height:76px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px;border:2px solid var(--blue-100)}
.confirm-box h1{font-size:1.3rem;letter-spacing:.02em}
.report-id-box{display:inline-block;background:var(--navy);color:#fff;font-weight:800;letter-spacing:.08em;padding:12px 22px;border-radius:12px;font-size:1.15rem;margin:6px 0 14px}
.detail-list{display:grid;gap:0}
.detail-list .dl-row{display:grid;grid-template-columns:1fr;gap:2px;padding:13px 0;border-bottom:1px solid var(--grey-200)}
.detail-list .dl-row:last-child{border-bottom:none}
.detail-list .dl-key{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey-500);font-weight:800}
.detail-list .dl-val{font-size:.96rem;color:var(--navy);font-weight:600;word-break:break-word}
@media(min-width:640px){.detail-list .dl-row{grid-template-columns:190px 1fr;align-items:start;gap:14px}.detail-list .dl-key{padding-top:2px}}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 18px 26px;border-left:2px solid var(--grey-200)}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.timeline .tl-head{font-weight:800;font-size:.88rem;color:var(--navy)}
.timeline .tl-time{font-size:.78rem;color:var(--grey-500);margin-bottom:3px}
.timeline .tl-body{font-size:.9rem;color:var(--navy-700)}
.empty{text-align:center;padding:44px 20px;color:var(--grey-500)}
.empty .empty-icon{width:62px;height:62px;border-radius:50%;background:var(--grey-100);color:var(--grey-500);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty h3{color:var(--navy);margin-bottom:4px}
.empty p{font-size:.9rem;margin-bottom:16px}
.spinner{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;flex:none}
.spinner.dark{border-color:var(--grey-300);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:1.6s}*{transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translate(-50%,20px);z-index:200;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function normaliseEmail(email) {
  return String(email).replace(/[\s\u00A0\u200B\uFEFF\u2028\u2029]/g, "").toLowerCase();
}

const MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];

function fmtDate(value) {
  if (!value) return "—";
  const d = new Date(value.length === 10 ? value + "T00:00:00" : value);
  if (isNaN(d)) return esc(value);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(value) {
  if (!value) return "";
  const [h, m] = String(value).split(":").map(Number);
  if (isNaN(h)) return esc(value);
  const suffix = h >= 12 ? "PM" : "AM";
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}:${String(m || 0).padStart(2, "0")} ${suffix}`;
}
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ` +
         `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function nowHM() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

let toastTimer = null;

  const el = $("#toast");

/* ---------------------------------------------------------------------------
   4. LOCAL CACHE
   --------------------------------------------------------------------------- */
const db = {
  users: {}, reports: {}, safety: null,
  settings: { adminInitialised: true, universityName: "University of Venda" }
};

let firebaseReady  = false;
let currentUserObj = null;
let reportsUnsub   = null;
let usersUnsub     = null;
let safetyUnsub    = null;

function normalizeDoc(data) {
  const out = Object.assign({}, data);
  if (out.createdAt && typeof out.createdAt.toDate === "function")
    out.createdAt = out.createdAt.toDate().toISOString();
  if (out.updatedAt && typeof out.updatedAt.toDate === "function")
    out.updatedAt = out.updatedAt.toDate().toISOString();
  if (Array.isArray(out.updates)) {
    out.updates = out.updates.map(u => Object.assign({}, u, {
      at: u.at && typeof u.at.toDate === "function" ? u.at.toDate().toISOString() : u.at
    }));
  }
  return out;
}

function reportsForStudent(uid) {
  return Object.values(db.reports).filter(r => r.studentId === uid)
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}
function allReports() {
  return Object.values(db.reports).sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}
function countByStatus(reports, status) {
  return reports.filter(r => r.status === status).length;
}

/* ---------------------------------------------------------------------------
   5. REAL-TIME LISTENERS
   --------------------------------------------------------------------------- */
function attachListeners() {
  detachListeners();
  if (!currentUserObj) return;

  const reportsQuery = currentUserObj.role === "admin"
    ? query(collection(firestore, "reports"), orderBy("createdAt", "desc"))
    : query(collection(firestore, "reports"), where("studentId", "==", currentUserObj.uid));

  reportsUnsub = onSnapshot(reportsQuery,
    snapshot => {
      db.reports = {};
      snapshot.forEach(d => { db.reports[d.id] = Object.assign({ id: d.id }, normalizeDoc(d.data())); });
      handleDataChange();
    },
    error => dbgErr("reports listener", error)
  );

  if (currentUserObj.role === "admin") {
    usersUnsub = onSnapshot(query(collection(firestore, "users")),
      snapshot => {
        db.users = {};
        snapshot.forEach(d => { db.users[d.id] = Object.assign({ uid: d.id }, normalizeDoc(d.data())); });
        handleDataChange();
      },
      error => dbgErr("users listener", error)
    );
  }

  safetyUnsub = onSnapshot(doc(firestore, "safety", "info"),
    snapshot => {
      db.safety = snapshot.exists() && Array.isArray(snapshot.data().categories)
        ? snapshot.data().categories : null;
      handleDataChange();
    },
    error => dbgErr("safety listener", error)
  );
}

function detachListeners() {
  if (reportsUnsub) { try { reportsUnsub(); } catch (_) {} reportsUnsub = null; }
  if (usersUnsub)   { try { usersUnsub(); }   catch (_) {} usersUnsub = null; }
  if (safetyUnsub)  { try { safetyUnsub(); }  catch (_) {} safetyUnsub = null; }
  db.reports = {}; db.users = {}; db.safety = null;
}

function handleDataChange() {
  const parts = parseRoute();
  const isFormPage =
    (parts[0] === "student" && parts[1] === "report")   ||
    (parts[0] === "student" && parts[1] === "profile")  ||
    (parts[0] === "admin"   && parts[1] === "profile")  ||
    (parts[0] === "admin"   && parts[1] === "safety");
  if (!isFormPage) render();
}

/* ---------------------------------------------------------------------------
   6. AUTHENTICATION
   --------------------------------------------------------------------------- */
function currentUser() { return currentUserObj; }
function isEmailValid(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(email).trim());
}

async function registerStudent({ fullName, studentNumber, email, password }) {
  const normalisedEmail = normaliseEmail(email);
  dbg("registerStudent: creating Auth user for", normalisedEmail);

  const credential = await createUserWithEmailAndPassword(auth, normalisedEmail, password);
  dbg("registerStudent: Auth uid =", credential.user.uid);

  const profile = {
    fullName: String(fullName).trim(),
    studentNumber: String(studentNumber).trim().toUpperCase(),
    email: normalisedEmail,
    role: "student",
    createdAt: serverTimestamp()
  };

  try {
    await setDoc(doc(firestore, "users", credential.user.uid), profile);
    dbg("registerStudent: Firestore profile written");
  } catch (error) {
    dbgErr("registerStudent: Firestore write FAILED — rolling back Auth user", error);
    try { await signOut(auth); } catch (_) {}
    throw error;
  }

  currentUserObj = Object.assign({ uid: credential.user.uid }, profile,
    { createdAt: new Date().toISOString() });
  return currentUserObj;
}

async function signIn(email, password) {
  const normalisedEmail = normaliseEmail(email);
  dbg("signIn: attempting Auth sign-in for", normalisedEmail);

  let credential;
  try {
    credential = await signInWithEmailAndPassword(auth, normalisedEmail, password);
  } catch (error) {
    dbgErr("signIn: signInWithEmailAndPassword FAILED", { code: error.code, message: error.message });
    throw error;
  }

  const uid = credential.user.uid;
  dbg("signIn: Auth success, uid =", uid);

  let profile = null;
  let lastError = null;

  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const snap = await getDoc(doc(firestore, "users", uid));
      if (snap.exists()) {
        profile = normalizeDoc(snap.data());
        dbg("signIn: profile loaded on attempt", attempt + 1);
        break;
      } else {
        dbgErr("signIn: users/" + uid + " does NOT exist");
        lastError = Object.assign(new Error("Profile document missing"), { code: "app/profile-missing" });
      }
    } catch (error) {
      dbgErr("signIn: getDoc failed attempt " + (attempt + 1), { code: error.code, message: error.message });
      lastError = Object.assign(new Error(error.message || "Firestore read failed"), {
        code: "app/profile-load-failed",
        original: error
      });
    }
    if (attempt < 2) await new Promise(r => setTimeout(r, 350));
  }

  if (!profile) {
    dbgErr("signIn: could not load profile after 3 attempts", lastError);
    throw lastError || Object.assign(new Error("Profile load failed"), { code: "app/profile-load-failed" });
  }

  profile.fullName      = profile.fullName      || "Student";
  profile.studentNumber = profile.studentNumber || "—";
  profile.email         = profile.email         || normalisedEmail;
  profile.role          = profile.role          || "student";

  currentUserObj = Object.assign({ uid }, profile);
  return currentUserObj;
}

async function doLogout() {
  await signOut(auth);
  currentUserObj = null;
}

function authErrorMessage(error) {
  const code = error && error.code ? String(error.code) : "unknown";
  dbgErr("authErrorMessage:", { code, message: error && error.message });

  switch (code) {
    case "auth/email-already-in-use":
      return "An account with this email address already exists.";
    case "auth/user-not-found":
      return "We couldn't find an account with that email address.";
    case "auth/wrong-password":
    case "auth/invalid-credential":
      return "Incorrect email or password. Please try again.";
    case "auth/invalid-email":
      return "Please enter a valid email address.";
    case "auth/weak-password":
      return "That password is too weak. Use at least 8 characters.";
    case "auth/user-disabled":
      return "This account has been disabled. Please contact the Safety Office.";
    case "auth/too-many-requests":
      return "Too many attempts. Please wait a moment and try again.";
    case "auth/network-request-failed":
      return "Network problem. Please check your connection and try again.";
    case "auth/operation-not-allowed":
      return "Email/password sign-in is not enabled. Please contact the Safety Office.";
    case "auth/popup-closed-by-user":
      return "Sign-in was cancelled. Please try again.";
    case "auth/requires-recent-login":
      return "Please sign in again to continue.";
    case "permission-denied":
    case "firestore/permission-denied":
      return "We couldn't access your account data. Please contact the Safety Office.";
    case "app/profile-missing":
      return "Your account exists but its profile is missing. Please contact the Safety Office.";
    case "app/profile-load-failed":
      return "We couldn't load your profile. Please check your connection and try again.";
    default:
      return "Something went wrong (" + code + "). Please try again.";
  }
}

/* ---------------------------------------------------------------------------
   7. AUTHORIZATION GUARD
   --------------------------------------------------------------------------- */
function requireRole(role) {
  const user = currentUser();
  if (!user || user.role !== role) {
    if (user) toast("You do not have permission to access that area.", "error");
    else toast("Please sign in to continue.");
    go(role === "admin" ? "#/admin/login" : "#/student/login");
    return null;
  }
  return user;
}

/* ---------------------------------------------------------------------------
   8. HELPERS
   --------------------------------------------------------------------------- */
function generateReportId() {
  const t = String(Date.now()).slice(-4);
  const r = String(Math.floor(Math.random() * 100)).padStart(2, "0");
  return "UNV-" + t + r;
}
function statusBadge(status) {
  const meta = STATUS_META[status] || STATUS_META["Pending"];
  return `<span class="badge ${meta.cls}">${I[meta.icon]}${esc(meta.label)}</span>`;
}

/* ---------------------------------------------------------------------------
   9. ROUTER
   --------------------------------------------------------------------------- */
function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}
function parseRoute() {
  return location.hash.replace(/^#/, "").split("/").filter(Boolean);
}
function mount(html, afterMount) {
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const caret = focusId && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const app = $("#app");
  app.innerHTML = html;
  if (afterMount) afterMount(app);
  window.scrollTo(0, 0);
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (caret != null) { try { el.setSelectionRange(caret, caret); } catch (_) {} }
    }
  }
}

function render() {
  if (!firebaseReady) {
    mount(`<div class="boot-screen"><span class="spinner"></span><span>Loading UNIVEN SAFE…</span></div>`);
    return;
  }
  const parts = parseRoute();
  const root = parts[0], sub = parts[1], id = parts[2];

  try {
    if (!root) return viewLanding();

    if (root === "student") {
      if (sub === "login")    return viewStudentLogin();
      if (sub === "register") return viewStudentRegister();
      if (sub === "forgot")   return viewForgotPassword();
      const user = requireRole("student");
      if (!user) return;
      if (!sub)                return viewStudentDashboard(user);
      if (sub === "report")    return viewReportForm(user);
      if (sub === "reports")   return id ? viewStudentReportDetail(user, id) : viewStudentReports(user);
      if (sub === "emergency") return viewEmergency("student");
      if (sub === "safety")    return viewSafetyInfo("student");
      if (sub === "profile")   return viewProfile("student", user);
      return viewNotFound();
    }

    if (root === "admin") {
      if (sub === "login") return viewAdminLogin();
      if (sub === "setup") return viewAdminSetupInfo();
      const user = requireRole("admin");
      if (!user) return;
      if (!sub)                return viewAdminDashboard(user);
      if (sub === "reports")   return id ? viewAdminReportDetail(user, id) : viewAdminReports(user);
      if (sub === "students")  return viewAdminStudents(user);
      if (sub === "safety")    return viewAdminSafety(user);
      if (sub === "profile")   return viewProfile("admin", user);
      if (sub === "settings")  return viewAdminSettings(user);
      return viewNotFound();
    }
    return viewNotFound();
  } catch (error) {
    dbgErr("render", error);
    mount(shellError());
  }
}

window.addEventListener("hashchange", render);

  const trigger = event.target.closest("[data-action]");
  if (!trigger) return;
  const action = trigger.dataset.action;
  if (action === "logout") {
    event.preventDefault();
    try {
      await doLogout();
      toast("You have been signed out.");
      go("#/");
    } catch (error) {
      dbgErr("logout", error);
      toast("We couldn't sign you out. Please try again.", "error");
    }
  }
  if (action === "open-drawer") {
    event.preventDefault();
    const drawer = $("#adminDrawer"), overlay = $("#drawerOverlay");
    if (drawer) { drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); }
    if (overlay) overlay.classList.add("open");
    trigger.setAttribute("aria-expanded", "true");
  }

    const drawer = $("#adminDrawer"), overlay = $("#drawerOverlay");
    if (drawer) { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); }

});

      drawer.setAttribute("aria-hidden", "true");

        errors.regStudentNumber = "Student numbers contain 5–15 letters or numbers.";
      if (!values.email) errors.regEmail = "Please enter your university email address.";
      else if (!isEmailValid(values.email)) errors.regEmail = "Please enter a valid email address.";
      if (!values.password) errors.regPassword = "Please create a password.";
      else if (values.password.length < 8) errors.regPassword = "Password must be at least 8 characters.";
      else if (!/[A-Za-z]/.test(values.password) || !/\d/.test(values.password))
        errors.regPassword = "Password must include at least one letter and one number.";
      if (!values.confirm) errors.regConfirm = "Please confirm your password.";
      else if (values.password !== values.confirm) errors.regConfirm = "Passwords do not match.";

      clearFieldErrors();
      if (Object.keys(errors).length) {
        showFieldErrors(errors);
        const first = $("#" + Object.keys(errors)[0]);
        if (first) first.focus();
        return;
      }

      const button = $("#registerSubmit");
      setLoading(button, true, "Creating account…");
      const alertBox = $("#registerAlert");
      alertBox.className = "alert alert-info";
      alertBox.style.marginBottom = "16px";
      alertBox.innerHTML = `<span class="spinner dark"></span><span>Creating your account…</span>`;

      try {
        await registerStudent(values);
        alertBox.className = "alert alert-success";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.check}<span><strong>Account created successfully.</strong> Welcome to UNIVEN SAFE.</span>`;
        toast("Account created successfully. Welcome to UNIVEN SAFE.", "success");
        setTimeout(() => go("#/student"), 900);
      } catch (error) {
        dbgErr("register FAILED:", { code: error && error.code, message: error && error.message });
        alertBox.className = "alert alert-error";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.info}<span>${esc(authErrorMessage(error))}</span>`;
        toast(authErrorMessage(error), "error");
        setLoading(button, false);
      }
    });

    function clearFieldErrors() {
      ["regName", "regStudentNumber", "regEmail", "regPassword", "regConfirm"].forEach(key => {
        $("#err-" + key).innerHTML = "";
        const input = $("#" + key);
        if (input) input.removeAttribute("aria-invalid");
      });
    }
    function showFieldErrors(errors) {
      Object.entries(errors).forEach(([key, message]) => {
        const holder = $("#err-" + key);
        if (holder) holder.innerHTML = fieldError("err-" + key, message);
        const input = $("#" + key);
        if (input) input.setAttribute("aria-invalid", "true");
      });
      toast("Please correct the highlighted fields.", "error");
    }
  });
}

      setLoading(button, true, "Signing in…");

        go("#/admin");

        </div>

      </div>
      <div class="field">

          ${I.upload}
          <p style="margin:8px 0 0;font-weight:700;font-size:.9rem">Tap to attach a photo or document</p>
          <p class="hint" style="margin:4px 0 0">JPG, PNG or PDF · maximum 500 KB</p>
          <input type="file" id="evidence" accept="image/jpeg,image/png,image/webp,application/pdf">
        </label>
        <div id="evidencePreview"></div>
        <div id="err-evidence"></div>
      </div>
      <div id="reportAlert" class="sr-only" aria-live="polite"></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="reportSubmit">Submit Report</button>
      <p class="hint" style="text-align:center;margin-top:12px">Your report is confidential and only visible to you and authorised safety administrators.</p>
    </form>
  `), () => {
    const form = $("#reportForm");
    const description = $("#description");
    const evidenceInput = $("#evidence");
    let evidenceData = null;

    description.addEventListener("input", () => {
      $("#charCount").textContent = String(description.value.length);
    });

    evidenceInput.addEventListener("change", () => {
      const file = evidenceInput.files && evidenceInput.files[0];
      const preview = $("#evidencePreview");
      const errorHolder = $("#err-evidence");
      errorHolder.innerHTML = "";
      evidenceData = null;
      if (!file) { preview.innerHTML = ""; return; }
      const allowed = ["image/jpeg", "image/png", "image/webp", "application/pdf"];
      if (!allowed.includes(file.type)) {
        errorHolder.innerHTML = fieldError("err-evidence", "Please attach a JPG, PNG or PDF file.");
        preview.innerHTML = ""; evidenceInput.value = ""; return;
      }
      if (file.size > 500 * 1024) {
        errorHolder.innerHTML = fieldError("err-evidence", "That file is larger than 500 KB. Please choose a smaller file.");
        preview.innerHTML = ""; evidenceInput.value = ""; return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        evidenceData = { name: file.name, type: file.type, dataUrl: String(reader.result) };
        preview.innerHTML = `<div class="file-name">${I.file}<span>${esc(file.name)} · ${(file.size / 1024).toFixed(0)} KB</span></div>`;
      };
      reader.onerror = () => {
        dbgErr("file read", reader.error);
        errorHolder.innerHTML = fieldError("err-evidence", "We couldn't read that file. Please try another one.");
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const values = {
        incidentType: $("#incidentType").value,
        location: $("#location").value.trim(),
        date: $("#incidentDate").value,
        time: $("#incidentTime").value,
        description: description.value.trim()
      };
      const errors = {};
      if (!values.incidentType) errors.incidentType = "Please select an incident type.";
      if (!values.location) errors.location = "Please enter the location of the incident.";
      if (!values.date) errors.incidentDate = "Please select the date.";
      if (!values.time) errors.incidentTime = "Please select the time.";
      if (!values.description) errors.description = "Please describe what happened.";
      else if (values.description.length < 10) errors.description = "Please provide a little more detail.";

      ["incidentType", "location", "incidentDate", "incidentTime", "description"].forEach(key => {
        const holder = $("#err-" + key);
        if (holder) holder.innerHTML = "";
        const input = $("#" + key);
        if (input) input.removeAttribute("aria-invalid");
      });
      if (Object.keys(errors).length) {
        Object.entries(errors).forEach(([key, message]) => {
          const holder = $("#err-" + key);
          if (holder) holder.innerHTML = fieldError("err-" + key, message);
          const input = $("#" + key);
          if (input) input.setAttribute("aria-invalid", "true");
        });
        const first = $("#" + Object.keys(errors)[0]);
        if (first) first.focus();
        toast("Please complete the highlighted fields.", "error");
        return;
      }

      const button = $("#reportSubmit");
      const alertBox = $("#reportAlert");
      setLoading(button, true, "Submitting report…");
      alertBox.className = "alert alert-info";
      alertBox.style.marginBottom = "16px";
      alertBox.innerHTML = `<span class="spinner dark"></span><span>Submitting report…</span>`;
      try {
        const reportId = generateReportId();
        await addDoc(collection(firestore, "reports"), {
          reportId,
          studentId: user.uid,
          studentName: user.fullName,
          studentNumber: user.studentNumber,
          studentEmail: user.email,
          incidentType: values.incidentType,
          location: values.location,
          date: values.date, time: values.time,
          description: values.description,
          evidenceUrl: evidenceData ? evidenceData.dataUrl : null,
          evidenceName: evidenceData ? evidenceData.name : null,
          status: "Pending",
          adminUpdate: "",
          updates: [],
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          updatedBy: null
        });
        showReportConfirmation(reportId);
      } catch (error) {
        dbgErr("submit report", error);
        alertBox.className = "alert alert-error";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.info}<span>We couldn't submit your report. Please check your connection and try again.</span>`;
        toast("We couldn't submit your report. Please try again.", "error");
        setLoading(button, false);
      }
    });
  });
}

      <h2>Update profile</h2>
      <form id="profileForm" novalidate>
        <div class="field">
          <label class="label" for="profileName">Full Name</label>
          <input class="input" type="text" id="profileName" value="${esc(user.fullName)}" required>
          <div id="err-profileName"></div>
        </div>
        ${isAdmin ? "" : `
        <div class="field">
          <label class="label" for="profileNumber">Student Number</label>
          <input class="input" type="text" id="profileNumber" value="${esc(user.studentNumber)}" disabled>
          <p class="hint">Student numbers are verified by the university and cannot be changed here.</p>
        </div>`}
        <div class="field">
          <label class="label" for="profileEmail">Email Address</label>
          <input class="input" type="email" id="profileEmail" value="${esc(user.email)}" disabled>

  mount(isAdmin
    ? adminShell("profile", pageHeader("My Profile", "Your administrator account.", "#/admin") + content, user)
    : studentShell("profile", pageHeader("My Profile", "Your UNIVEN SAFE account.", "#/student") + content),
  () => {
    $("#profileForm").addEventListener("submit", async event => {
      event.preventDefault();
      const alertBox = $("#profileAlert");
      const name = $("#profileName").value.trim();
      if (!name || name.length < 3) {
        $("#err-profileName").innerHTML = fieldError("err-profileName", "Please enter your full name.");
        $("#profileName").setAttribute("aria-invalid", "true");
        return;
      }
      $("#err-profileName").innerHTML = "";
      $("#profileName").removeAttribute("aria-invalid");
      const button = $("#profileSubmit");
      setLoading(button, true, "Saving…");
      try {
        await updateDoc(doc(firestore, "users", user.uid), {
          fullName: name,
          updatedAt: serverTimestamp()
        });
        if (db.users[user.uid]) db.users[user.uid].fullName = name;
        currentUserObj = Object.assign({}, currentUserObj, { fullName: name });
        alertBox.className = "alert alert-success";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.check}<span>Profile updated successfully.</span>`;
        toast("Profile updated successfully.", "success");
      } catch (error) {
        dbgErr("profile update", error);
        alertBox.className = "alert alert-error";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.info}<span>We couldn't save your changes. Please try again.</span>`;
      } finally {
        setLoading(button, false);
      }
    });
  });
}

function viewAdminReports(user) {
  mount(adminShell("reports", `
    ${pageHeader("Reports", "Search, filter and manage all submitted safety reports.")}
    <div class="card" style="margin-bottom:16px">
      <div class="field" style="margin-bottom:12px">
        <label class="label" for="reportSearch">Search reports</label>
        <input class="input" type="search" id="reportSearch" placeholder="Search by report ID, incident, location, student number or name…">
      </div>
      <div class="row" id="statusFilters" role="group" aria-label="Filter by status">
        <button class="btn btn-sm btn-primary" data-status="All" type="button">All</button>
        ${STATUSES.map(status => `<button class="btn btn-sm btn-outline" data-status="${esc(status)}" type="button">${esc(status)}</button>`).join("")}
      </div>
    </div>
    <div id="reportsList"></div>
  `, user), () => {
    let activeStatus = "All";
    let searchTerm = "";
    const searchInput = $("#reportSearch");
    const listHolder = $("#reportsList");
    const filterButtons = $$("#statusFilters button");
    function applyFilters() {
      const term = searchTerm.trim().toLowerCase();
      return allReports().filter(report => {
        if (activeStatus !== "All" && report.status !== activeStatus) return false;
        if (!term) return true;
        return [report.reportId, report.incidentType, report.location, report.studentName, report.studentNumber, report.status]
          .some(field => String(field || "").toLowerCase().includes(term));
      });
    }
    function draw() {
      const results = applyFilters();
      if (!results.length) {
        listHolder.innerHTML = `<div class="card">${emptyState("No matching reports", searchTerm || activeStatus !== "All" ? "Try a different search term or filter." : "Reports submitted by students will appear here in real time.")}</div>`;
        return;
      }
      listHolder.innerHTML = `
        <p class="text-sm text-muted" style="margin-bottom:10px">Showing ${results.length} of ${allReports().length} reports</p>
        <div class="card card--flush">
          <div class="data-head"><span>Report ID</span><span>Incident</span><span>Location</span><span>Student</span><span>Status</span><span>Date</span></div>
          ${results.map(report => `
            <a class="data-row" href="#/admin/reports/${encodeURIComponent(report.id)}">
              <div class="dr-cell" data-label="Report ID"><strong class="mono">${esc(report.reportId)}</strong></div>
              <div class="dr-cell" data-label="Incident">${esc(report.incidentType)}</div>
              <div class="dr-cell" data-label="Location">${esc(report.location)}</div>
              <div class="dr-cell" data-label="Student">${esc(report.studentName)}<div class="text-sm text-muted">${esc(report.studentNumber || "")}</div></div>
              <div class="dr-cell" data-label="Status">${statusBadge(report.status)}</div>
              <div class="dr-cell" data-label="Date">${fmtDate(report.date)}</div>
            </a>`).join("")}
        </div>`;
    }
    searchInput.addEventListener("input", () => { searchTerm = searchInput.value; draw(); });
    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        activeStatus = button.dataset.status;
        filterButtons.forEach(b => {
          const isActive = b === button;
          b.className = "btn btn-sm " + (isActive ? "btn-primary" : "btn-outline");
          b.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
        draw();
      });
      button.setAttribute("aria-pressed", button.dataset.status === "All" ? "true" : "false");
    });
    draw();
  });
}

            <div class="tl-body">Submitted by ${esc(report.studentName)}</div>

            <li>

      if (newStatus === current.status && newUpdate === (current.adminUpdate || "")) { toast("No changes to save."); return; }
      setLoading(button, true, "Saving changes…");
      alertBox.className = "alert alert-info";
      alertBox.style.marginBottom = "16px";
      alertBox.innerHTML = `<span class="spinner dark"></span><span>Saving changes…</span>`;
      try {
        const updates = Array.isArray(current.updates) ? current.updates.slice() : [];
        updates.push({
          status: newStatus,
          text: newUpdate || (newStatus !== current.status ? `Status changed to ${newStatus}.` : ""),
          at: new Date().toISOString(),
          by: user.fullName
        });
        await updateDoc(doc(firestore, "reports", reportId), {
          status: newStatus,
          adminUpdate: newUpdate,
          updates,
          updatedAt: serverTimestamp(),
          updatedBy: user.fullName
        });

        alertBox.className = "alert alert-error";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.info}<span>We couldn't save your changes. Please check your connection and try again.</span>`;
        toast("We couldn't save your changes.", "error");
      } finally {
        setLoading(button, false);
      }
    });
  });
}

function viewAdminStudents(user) {
  const students = Object.values(db.users).filter(u => u.role === "student");
  const reports = allReports();
  const rows = students.map(student => {

            </div>`).join("")}
         </div>`}
    <div class="alert alert-info" style="margin-top:16px">${I.info}<div>Student records are read-only here. Personal information is only visible to authorised safety administrators.</div></div>
  `, user));
}

function viewAdminSafety(user) {
  const categories = db.safety || defaultSafety();
  mount(adminShell("safety", `
    ${pageHeader("Safety Information", "Edit the safety guidance published to students.")}
    <form id="safetyForm">
      ${categories.map(category => `
        <div class="card" style="margin-bottom:16px">
          <div class="field">
            <label class="label" for="title-${esc(category.id)}">Section Title</label>
            <input class="input" type="text" id="title-${esc(category.id)}" value="${esc(category.title)}" data-role="title" data-id="${esc(category.id)}">
          </div>
          <div class="field" style="margin-bottom:0">
            <label class="label" for="items-${esc(category.id)}">Guidance (one point per line)</label>
            <textarea class="textarea" id="items-${esc(category.id)}" data-role="items" data-id="${esc(category.id)}" style="min-height:150px">${esc(category.items.join("\n"))}</textarea>
          </div>
        </div>`).join("")}
      <div id="safetyAlert" class="sr-only" aria-live="polite"></div>
      <button class="btn btn-primary btn-lg" type="submit" id="safetySaveBtn">Save Safety Information</button>
    </form>
  `, user), () => {
    $("#safetyForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = $("#safetySaveBtn");
      const alertBox = $("#safetyAlert");
      setLoading(button, true, "Saving…");
      try {
        const nextCategories = categories.map(cat => {
          const titleInput = $(`[data-role="title"][data-id="${cat.id}"]`);
          const itemsInput = $(`[data-role="items"][data-id="${cat.id}"]`);
          return {
            id: cat.id,
            title: titleInput ? titleInput.value.trim() || cat.title : cat.title,
            items: itemsInput ? itemsInput.value.split("\n").map(l => l.trim()).filter(Boolean) : cat.items
          };
        });
        await setDoc(doc(firestore, "safety", "info"), {
          categories: nextCategories,
          updatedAt: serverTimestamp(),
          updatedBy: user.fullName
        });
        db.safety = nextCategories;
        alertBox.className = "alert alert-success";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.check}<span>Safety information updated. Students will see the changes immediately.</span>`;
        toast("Safety information saved.", "success");
      } catch (error) {
        dbgErr("safety save", error);
        alertBox.className = "alert alert-error";
        alertBox.style.marginBottom = "16px";
        alertBox.innerHTML = `${I.info}<span>We couldn't save the safety information. Please try again.</span>`;
      } finally {
        setLoading(button, false);
      }
    });
  });
}

/* ---------------------------------------------------------------------------
   15. LOADING HELPER
   --------------------------------------------------------------------------- */
function setLoading(button, isLoading, label) {
  if (!button) return;
  if (isLoading) {
    if (!button.dataset.originalLabel) button.dataset.originalLabel = button.innerHTML;
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.innerHTML = `<span class="spinner"></span><span>${esc(label || "Please wait…")}</span>`;
  } else {
    button.disabled = false;
    button.removeAttribute("aria-busy");
    if (button.dataset.originalLabel) {
      button.innerHTML = button.dataset.originalLabel;
      delete button.dataset.originalLabel;
    }
  }
}

/* ---------------------------------------------------------------------------
   16. BOOT
   --------------------------------------------------------------------------- */
onAuthStateChanged(auth, async firebaseUser => {
  firebaseReady = false;
  dbg("onAuthStateChanged fired. firebaseUser:", firebaseUser ? firebaseUser.uid : null);

  if (firebaseUser) {
    if (!currentUserObj || currentUserObj.uid !== firebaseUser.uid) {
      try {
        const snap = await getDoc(doc(firestore, "users", firebaseUser.uid));
        if (snap.exists()) {
          const profile = normalizeDoc(snap.data());
          profile.fullName      = profile.fullName      || "Student";
          profile.studentNumber = profile.studentNumber || "—";
          profile.email         = profile.email         || (firebaseUser.email || "");
          profile.role          = profile.role          || "student";
          currentUserObj = Object.assign({ uid: firebaseUser.uid }, profile);
        } else {
          currentUserObj = null;
        }
      } catch (error) {
        dbgErr("onAuthStateChanged/getDoc", error);
        if (!currentUserObj) currentUserObj = null;
      }
    }
  } else {
    currentUserObj = null;
  }

  if (currentUserObj) attachListeners();
  else detachListeners();

  firebaseReady = true;

  if (!location.hash || location.hash === "#/" || location.hash === "#") {
    if (currentUserObj && currentUserObj.role === "admin")  location.hash = "#/admin";
    else if (currentUserObj && currentUserObj.role === "student") location.hash = "#/student";
  }

  render();
});
</script>
